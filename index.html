<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffcc70" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Math Fun Cards" />
    <title>Math Fun Cards</title>

    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <header class="top">
        <div class="header-row">
          <button id="quitToMenu" class="back-btn" type="button" hidden>
            <span aria-hidden="true">←</span>
            <span>Main Menu</span>
          </button>
          <h1>Math Fun Cards</h1>
          <div class="settings" id="settingsWrap">
            <button
              id="settingsBtn"
              class="settings-btn"
              type="button"
              aria-label="Open settings"
              aria-haspopup="menu"
              aria-expanded="false"
              aria-controls="settingsMenu"
            >
              <span class="settings-gear" aria-hidden="true">&#9881;</span>
              <span>Settings</span>
            </button>
            <div id="settingsMenu" class="settings-menu" role="menu" hidden>
              <label class="menu-item menu-item-select" for="rangeSelect">
                Number Range
                <select id="rangeSelect" class="menu-select">
                  <option value="10">0 to 10</option>
                  <option value="20">0 to 20</option>
                  <option value="50">0 to 50</option>
                </select>
              </label>
              <label class="menu-item" for="soundToggle">
                <input id="soundToggle" type="checkbox" checked />
                Sound Effects
              </label>
              <label class="menu-item" for="voiceToggle">
                <input id="voiceToggle" type="checkbox" checked />
                Voice Feedback
              </label>
              <button id="resetBestBtn" class="menu-button" type="button" role="menuitem">
                Reset Best Streak
              </button>
            </div>
          </div>
        </div>
        <p id="subtitle" class="subtitle">Choose a mode to start!</p>
      </header>

      <section id="startMenu" class="start-menu" aria-label="Game modes">
        <h2>Pick a play mode</h2>
        <p id="startMessage" class="start-message">How do you want to play?</p>
        <div id="modeActions" class="mode-actions" role="group" aria-label="Play modes">
          <button class="mode-btn" type="button" data-mode="time-trial">
            <span class="mode-icon" aria-hidden="true">⏱️</span>
            <span>Time Trial</span>
          </button>
          <button class="mode-btn" type="button" data-mode="infinite">
            <span class="mode-icon" aria-hidden="true">♾️</span>
            <span>Infinite</span>
          </button>
        </div>
        <div id="durationActions" class="duration-actions" role="group" aria-label="Time trial duration" hidden>
          <button class="duration-btn" type="button" data-seconds="15">15 seconds</button>
          <button class="duration-btn" type="button" data-seconds="30">30 seconds</button>
          <button class="duration-btn" type="button" data-seconds="60">60 seconds</button>
          <button id="durationBackBtn" class="duration-back-btn" type="button">Back</button>
        </div>
      </section>

      <div id="gameArea" hidden>
        <section class="card" aria-label="Flashcard">
          <p id="emoji" class="emoji" aria-hidden="true">🧸</p>
          <p id="question" class="question">1 + 1 = ?</p>
          <div id="answers" class="answers" role="group" aria-label="Answer choices"></div>
        </section>

        <section class="feedback-wrap">
          <p id="feedback" class="feedback">Let’s play!</p>
        </section>

        <footer class="bottom">
          <div class="stats">
            <span>⭐ Streak: <strong id="streak">0</strong></span>
            <span>🏆 Best: <strong id="best">0</strong></span>
            <span>✅ Completed: <strong id="completedCards">0</strong></span>
            <span id="timerStat" hidden>⏱️ Time: <strong id="timer">60s</strong></span>
          </div>
          <button id="newCard" class="btn" type="button">Next Card</button>
        </footer>
      </div>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
